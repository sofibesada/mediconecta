# MediConecta completo con un solo comando:  docker compose up --build
#
#   frontend  http://localhost:5173                     SPA (nginx)
#   app       http://localhost:8080/mediconecta/api     WildFly + los dos simuladores externos
#   broker    http://localhost:8161/console             consola de ActiveMQ Artemis (DLQ, reproceso)
#
# Las credenciales de abajo son SOLO del entorno local de demo y se pueden cambiar sin
# tocar el repo, con un archivo .env junto a este (ver .env.example).

name: mediconecta

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mediconecta
      POSTGRES_USER: ${DB_USER:-mediconecta}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mediconecta}
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d mediconecta"]
      interval: 5s
      timeout: 5s
      retries: 30

  broker:
    image: apache/activemq-artemis:2.39.0-alpine
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:-artemis}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-artemis}
    volumes:
      - ./docker/artemis/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
      # Instancia del broker en un volumen: el journal (mensajes persistentes, suscripciones
      # durables, DLQ) sobrevive a reiniciar el broker y tambien a "docker compose down" y a
      # recrear el contenedor. Solo "down -v" lo borra. Se monta la carpeta entera porque
      # en la imagen ya pertenece al usuario artemis (una subcarpeta nueva quedaria de root).
      - datos-broker:/var/lib/artemis-instance
    ports:
      - "127.0.0.1:8161:8161"
    healthcheck:
      test: ["CMD-SHELL", "/var/lib/artemis-instance/bin/artemis check node --up --silent --user $${ARTEMIS_USER} --password $${ARTEMIS_PASSWORD}"]
      interval: 10s
      timeout: 20s
      retries: 30

  app:
    build:
      context: .
      dockerfile: docker/wildfly/Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: mediconecta
      DB_USER: ${DB_USER:-mediconecta}
      DB_PASSWORD: ${DB_PASSWORD:-mediconecta}
      ARTEMIS_HOST: broker
      ARTEMIS_USER: ${ARTEMIS_USER:-artemis}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-artemis}
      MEDICONECTA_ADMIN_PASSWORD: ${MEDICONECTA_ADMIN_PASSWORD:-admin1234}
      MEDICONECTA_JWT_SECRET: ${MEDICONECTA_JWT_SECRET:-}
      VIDEOLLAMADAS_API_KEY: ${VIDEOLLAMADAS_API_KEY:-videollamadas-demo}
      PAGOS_API_KEY: ${PAGOS_API_KEY:-pagos-demo}
      OBRASSOCIALES_ADMIN_KEY: ${OBRASSOCIALES_ADMIN_KEY:-padron-demo}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9990 && printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 10s
      retries: 60

  frontend:
    # React + TypeScript compilado con Vite y servido por nginx (ver frontend/Dockerfile).
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/mediconecta/api
    ports:
      - "5173:80"
    depends_on:
      - app

volumes:
  datos-db:
  datos-broker:
