# Content-Security-Policy de la SPA (nivel http, para usarla en cada location).
# - scripts, estilos y fuentes: solo los propios (sin inline ni terceros);
# - connect-src 'self': la API está en el mismo origen;
# - frame-ancestors 'none': nadie puede mostrar la app dentro de un frame (clickjacking).
map $host $csp_spa {
    default "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}
