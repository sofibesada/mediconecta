# Encabezados de seguridad comunes (los incluye cada location de default.conf).
# HSTS: el navegador usa siempre HTTPS para este sitio durante un año.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Aislamiento entre sitios (Spectre): nada de otro origen puede cargar estos recursos, y la app
# solo carga recursos propios.
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
