# MediConecta detrás de nginx: la única puerta para el navegador.
#
#   https://localhost:8443          la SPA (React) y la API en el MISMO origen
#   https://localhost:8443/mediconecta/api/...  se reenvía a WildFly (app:8080)
#   http://localhost:5173           redirige a HTTPS
#
# El certificado se genera al construir la imagen (autofirmado, solo para el entorno local:
# el navegador avisa la primera vez). En un despliegue real se monta uno válido en
# /etc/nginx/tls (certificado.pem y clave.pem) sin cambiar nada más.

# HTTP: todo a HTTPS.
server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/certificado.pem;
    ssl_certificate_key /etc/nginx/tls/clave.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # nginx no hereda los add_header del server en un location que define los suyos: por eso
    # cada location incluye los encabezados de seguridad comunes.
    include /etc/nginx/snippets/seguridad.conf;
    add_header Content-Security-Policy $csp_spa always;

    # API: mismo origen que la SPA (sin CORS). WildFly no se expone al navegador.
    location /mediconecta/api/ {
        # Se resuelve "app" en cada pedido (DNS de Docker): si WildFly se recrea con otra IP,
        # nginx la sigue encontrando sin reiniciarse.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $wildfly http://app:8080;
        proxy_pass $wildfly;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
        include /etc/nginx/snippets/seguridad.conf;
        # La API solo devuelve JSON: no puede cargar nada ni mostrarse en un frame.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
    }

    # Los archivos de /assets llevan un hash en el nombre: se pueden guardar en cache para siempre.
    location /assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Content-Security-Policy $csp_spa always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta (/mis-citas, /pacientes/3/historia...) devuelve index.html y la
    # resuelve React Router. index.html no se guarda en cache para tomar siempre la ultima version.
    location / {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Content-Security-Policy $csp_spa always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
