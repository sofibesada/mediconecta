# Integracion continua: en cada push y pull request a main.
#   1. secretos   gitleaks revisa TODO el historial (no puede haber claves en el repo)
#   2. build      compila y corre las pruebas unitarias del backend
#      frontend   ESLint, TypeScript, pruebas unitarias (Vitest) y build de la SPA en React
#   3. api        levanta el sistema completo con Docker Compose y corre las pruebas de la API,
#                 las de punta a punta (Playwright) y Lighthouse de accesibilidad
#   4. sonar      analisis estatico en SonarCloud (solo si esta cargado el secreto SONAR_TOKEN)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Secretos en el historial (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact -v

  build:
    name: Build y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn verify
        run: mvn -B verify

  frontend:
    name: Frontend (lint, tipos, pruebas y build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Pruebas unitarias (Vitest) con cobertura
        run: npx vitest run --coverage
      - name: Build de produccion
        run: npm run build
      - name: Cobertura del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/

  api:
    name: Sistema completo + API + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Clave de prueba de esta corrida: la usan el servidor y las pruebas (token vencido).
      MEDICONECTA_JWT_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}-clave-de-prueba-del-pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Secretos de esta corrida (SEC-07 y SEC-10)
        # Contrasenas al azar en cada corrida: no hay credenciales del broker en el repo.
        run: |
          echo "ARTEMIS_PUB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "ARTEMIS_CON_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MEDICONECTA_CLAVE_DATOS=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Levantar el sistema (docker compose)
        run: docker compose up --build -d --wait --wait-timeout 600
      - name: Permisos de las cuentas del broker (SEC-07)
        run: docker compose exec -T broker bash /opt/mediconecta/verificar-permisos.sh
      - name: Pruebas de la API
        run: |
          docker compose logs -f --no-log-prefix app > app.log 2>&1 &
          mvn -B test \
            -Dapi.base=http://localhost:8080/mediconecta/api \
            -Dadmin.email=admin@mediconecta.com -Dadmin.password=admin1234 \
            -Dwildfly.log=app.log
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Pruebas de punta a punta (Playwright)
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Accesibilidad (Lighthouse >= 90)
        working-directory: e2e
        run: npm run lighthouse
      - name: Evidencia de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-api-e2e
          path: |
            target/surefire-reports/
            target/seguridad/
            app.log
            e2e/reporte/
            e2e/resultados/
      - name: Bajar el sistema
        if: always()
        run: docker compose down -v

  sonar:
    name: Analisis estatico (SonarCloud)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Sonar
        if: env.SONAR_TOKEN != ''
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar -Dsonar.qualitygate.wait=true
      - name: Sin SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Falta el secreto SONAR_TOKEN; el analisis lo hace por ahora el Analisis automatico de SonarCloud."
